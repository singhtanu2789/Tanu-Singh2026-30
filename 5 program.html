<!DOCTYPE>
<html>
    <head>
        <title>This is DIV and Span</title>
        <style>
            .one{border: 2px solid black; background-color: yellow; text-align: center}
            .two{border:5px solid black;  background-color: red; text-align}
            .three{border:2px solid black;  background-color: green; text-align}
            h1{color:brown}
            .test{color:rgb(135, 222, 142)}
            p1{color:aqua}
        </style>
    </head>
    <body>
        <div class="one">
            <h1 align="center">ITM<span class="test">UNIVERSITY</span>GWALIOR</h1>
            <p class="p1">Computer Science</p>
        </div>
        <div class="two">
            <p>School of Computing Systems</p>
        </div>
        <div class="three">
            <p>Madhya Pradesh</p>
        </div>
    </body>

</html>
